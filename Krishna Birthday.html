<html>
    <head>
        <title>Happy Birthday Krishna Ji</title>
        <style>
            div{
                width: 500px;
                height: 500px;
                border: 1px solid black;
                margin-left: 500px;
                margin-top: 100px;
                background: red;
                border-radius: 15px;
                box-shadow: 4px 8px 12px grey;
            }
            img{
                width: 200px;
                height: 200px;
                margin-left: 140px;
                margin-top: 100px;
                animation: de 2s ease alternate infinite;
            }
            @keyframes de{
                from{
                    transform: scale(0);
                }
                to{
                    transform: scale(500px);
                }
            }
           h1{
                    text-align: center; 
                    animation: Raj 2s ease alternate infinite;
                }
                @keyframes Raj {
                    from{
                        transform: scale(0);
                    }
                    to{
                        text-replace: scale(800px);
                    }
                    
                }
                
            
        </style>
    </head>
    <body>
        <div>
            <marquee behavior="alternate" direction="down"><img src="./Radhe.png" alt=""></marquee>
            <h1>Happy Birthday Krishna JI</h1>
        </div>
    </body>
</html>
