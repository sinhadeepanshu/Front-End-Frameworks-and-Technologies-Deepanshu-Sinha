<html>
    <head>
        <title>Student Registration Form</title>
        <style>
            h1{
                text-align: center;
            }
            form{
                border: 3px solid black;
                width: 500px;
                margin-left: 300px;
                background-color: lightpink;
                border-radius: 15px;
                   box-shadow: 4px 8px 12px black;
            }
            label{
                margin-left: 100px;
            }
            #i1{
                margin-left: 55px;
            }
            #i2{
                margin-left: 60px;
            }
            #i4{
              margin-left: 65px;
            }
            #i5{
                margin-left: 60px;
            }
            #i6{
                margin-left: 20px;
            }
            #i7{
                margin-left: 50px;
            }
            #i8{
                margin-left: 47px;
            }
            #i9{
                margin-left: 44px;
            }
            #i10{
                margin-left: 40px;
            }
            #i11{
                margin-left: 40px;
            }
            #b1{
                margin-left: 150px;
                margin-bottom: 50px;
                background-color: rgb(3, 146, 13);
                height: 50px;
                width: 100px;
                border: none;
                border-radius: 5px;
            }
            #b1:hover{
                background-color: rgb(11, 54, 243);
            }
            #b2{
                margin-bottom: 50px;
                background-color: red;
                height: 50px;
                width: 100px;
                border: none;
                border-radius: 5px;
            }
            #b2:hover{
                background-color: blue;
            }

        </style>
    </head>
    <body>
        <form>
            <h1>Student Registration Form</h1>
            <label>Reg id:</label>
            <input type="text" id="i1" placeholder="Enter your Reg id " required ><br><br>
            <label>Name:</label>
            <input type="text" id="i2"  placeholder="Enter your Name " required><br><br>
            <label>Gender:</label>
            <input type="radio" name="gender" value="Male"> Male <input type="radio" name="gender" value="Female"> Female <input type="radio" name="gender" value="Other"> Other<br><br>
            <label>DOB:</label>
            <input type="date" id="i4" placeholder="Enter your DOB " required><br><br>
            <label>Email:</label>
            <input type="email" id="i5" placeholder="Enter your Email " required><br><br>
            <label>Phone Number:</label>
            <input type="number" placeholder="Enter your Number" required><br><br>
            <label>Department:</label>
            <input type="text" id="i6" placeholder="Enter your Department " required><br><br>
            <label>Course:</label>
            <input type="text" id="i7" placeholder="Enter your Course " required><br><br>
            <label>Section:</label>
            <input type="text" id="i8" placeholder="Enter your Section " required><br><br>
            <label>College:</label>
            <input type="text" id="i9" placeholder="Enter your College " required><br><br>
            <label>Address:</label>
            <input type="text" id="i10" placeholder="Enter your Address " required><br><br>
            <label>Resume:</label>
            <input type="file" id="i11" placeholder="Enter your Resume " required><br><br>
           <div style="display: flex; justify-content: left; gap: 30px;">
    <input type="submit" id="b1" value="Submit">
    <input type="reset" id="b2" value="Reset">
</div>
        </form> 
    </body>
</html>
