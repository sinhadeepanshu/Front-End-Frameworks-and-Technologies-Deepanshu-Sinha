<html>
<head>
    <title>Facebook</title>
    <style>
        h1{
            text-align: center;
            color: #1877f2;
            font-size: 45px;
        }
        form{
            border: 1px solid white;
            width: 300px;
            margin: auto;
            margin-top: 80px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 4px 8px 12px gray;
            padding: 20px;
        }

        label{
            margin-left: 20px;
        }

        #i1,#i2{
            width: 90%;
            height: 40px;
            margin-left: 20px;
            border: 1px solid gray;
            border-radius: 5px;
            padding-left: 10px;
        }

        #b1{
            width: 90%;
            height: 35px;
            margin-left: 20px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
        }

        #b1:hover{
            background-color: #166fe5;
        }

        #b2{
            width: 60%;
            height: 45px;
            margin-left: 80px;
            background-color: #42b72a;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        #b2:hover{
            background-color: #36a420;
        }
        body{
            background-color: #fbfbfb;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>
    <form>
        <h1>facebook</h1>
        <input type="text" id="i1" placeholder="Email address or phone number" required>
        <br><br>
        <input type="password" id="i2" placeholder="Password" required>
        <br><br>
        <input type="submit" id="b1" value="Log In">
        <br><br>
        <input type="button" id="b2" value="Create New Account">
    </form>
</body>
</html>
